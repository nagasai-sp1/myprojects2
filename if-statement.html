		console.log("thirdBiggest number is:",thirdBiggest);

function findThirdBiggest(arr){
	arr.sort((a,b) => b - a);
	return arr[2];
}

function findreversednumber(num){
	let reversednumber=num.toString().split('').reverse().join('');
	return parseInt(reversednumber);
}
let number = 12345;
let reversednumber = findreversednumber(number);
console.log(reversednumber);

}

function finduniquewords(paragraph){
	const words = paragraph.
	toLowerCase().
	split(/\s+/);
	const uniquewords = new Set(words);
	return uniquewords;
}
